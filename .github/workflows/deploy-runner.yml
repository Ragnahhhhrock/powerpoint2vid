name: Deploy video runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['studio/**', 'workers/runner/**', '.github/workflows/deploy-runner.yml']
concurrency: deploy-runner
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: workers/runner
        run: npm install
      - name: Clean secrets (strip stray whitespace)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN=$(printf '%s' "$T" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$A" | tr -d '[:space:]')" >> "$GITHUB_ENV"
      - name: Deploy Worker and container
        working-directory: workers/runner
        run: npx wrangler deploy
      - name: Set Worker secrets
        working-directory: workers/runner
        env:
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf '%s' "$RUNNER_SECRET" | tr -d '[:space:]' | npx wrangler secret put RUNNER_SECRET
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi
